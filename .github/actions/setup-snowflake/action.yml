name: Setup Snowflake connection (OIDC)
description: |
  Writes a named CI connection to ~/.snowflake/config.toml for secretless,
  Workload-Identity-Federation (OIDC) authentication.

  Prerequisites (run once per environment — see docs/oidc-setup.md):
    * A Snowflake SERVICE user with WORKLOAD_IDENTITY (TYPE = OIDC) whose SUBJECT
      matches the calling job's GitHub OIDC subject.
    * The calling job MUST run the snowflakedb/snowflake-cli-action step with
      use-oidc: true AND oidc-token-name: SNOWFLAKE_CONNECTIONS_CI_TOKEN
      BEFORE this action, and declare  permissions: { id-token: write }.

  The snowflake-cli-action exports the short-lived token as
  SNOWFLAKE_CONNECTIONS_CI_TOKEN plus the global SNOWFLAKE_AUTHENTICATOR /
  SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER / SNOWFLAKE_AUDIENCE variables. This
  action only writes the account + user for the named 'ci' connection; no
  secret is ever stored.

inputs:
  sf-account:
    required: false
    default: "sfseeurope-wkot_demo1"
    description: |
      Snowflake account identifier (no .snowflakecomputing.com suffix).
      Override per-repo via a GitHub repository variable GIT_SIS_SF_ACCOUNT.
  sf-user:
    required: true
    description: |
      Snowflake SERVICE user for this environment's OIDC subject.
      e.g. CI_SVC_CI (env ci), CI_SVC_PREVIEW (env preview), CI_SVC_PROD (env prod).
  connection-name:
    required: false
    default: "ci"
    description: Named connection created in config.toml (used as -c <name> in snow CLI calls)

runs:
  using: composite
  steps:
    - name: Write Snowflake config.toml (WORKLOAD_IDENTITY / OIDC)
      shell: bash
      env:
        SF_ACCOUNT: ${{ inputs.sf-account }}
        SF_USER: ${{ inputs.sf-user }}
        CONN_NAME: ${{ inputs.connection-name }}
      run: |
        # The snowflake-cli-action exports the OIDC token as an env var named
        # SNOWFLAKE_CONNECTIONS_<UPPER_NAME>_TOKEN (e.g. SNOWFLAKE_CONNECTIONS_CI_TOKEN).
        # snow CLI reads env-var overrides natively, but Snowpark's Session.builder
        # with connection_name reads only config.toml. We write the token directly
        # into the config so both snow CLI and Snowpark authenticate correctly.
        TOKEN_VAR="SNOWFLAKE_CONNECTIONS_$(echo "$CONN_NAME" | tr '[:lower:]' '[:upper:]')_TOKEN"
        TOKEN_VALUE="${!TOKEN_VAR}"

        mkdir -p ~/.snowflake
        cat > ~/.snowflake/config.toml <<TOML
        [connections.${CONN_NAME}]
        account = "${SF_ACCOUNT}"
        user = "${SF_USER}"
        authenticator = "WORKLOAD_IDENTITY"
        workload_identity_provider = "OIDC"
        token = "${TOKEN_VALUE}"
        TOML
        # Remove leading whitespace from heredoc indentation
        sed -i 's/^        //' ~/.snowflake/config.toml
        chmod 0600 ~/.snowflake/config.toml
