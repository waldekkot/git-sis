name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: Unit tests + lint (no Snowflake)
    # Runs on every push and every PR — no credentials required.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short

      - name: Run ruff lint
        run: uv run ruff check app/

  integration-tests:
    name: Integration tests (real Snowflake)
    # Runs after unit tests pass, on push to main only.
    # Uses the same CI connection as deploy-to-sis; creates and drops a
    # disposable GIT_SIS_TEST_<uuid> schema — never touches production data.
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync

      - name: Configure Snowflake CI connection
        run: |
          echo "$SF_PAT_TOKEN" > /tmp/sf_token.txt
          mkdir -p ~/.snowflake
          printf '[connections.ci]\naccount = "sfseeurope-wkot_demo1"\nuser = "wkot"\nauthenticator = "PROGRAMMATIC_ACCESS_TOKEN"\ntoken_file_path = "/tmp/sf_token.txt"\n' \
            > ~/.snowflake/config.toml
          chmod 0600 ~/.snowflake/config.toml
        env:
          SF_PAT_TOKEN: ${{ secrets.SF_PAT_TOKEN }}

      - name: Run integration tests
        # Each test gets its own GIT_SIS_TEST_<uuid> schema (function-scoped fixture).
        # -n 5: 5 concurrent workers → schemas created/dropped in parallel.
        # --no-cov: integration tests cover only lib/ingest.py; full coverage
        #           is measured by the unit-tests job.
        run: uv run pytest tests/integration/ -v --tb=short --no-cov -n 5
        env:
          SNOWFLAKE_DEFAULT_CONNECTION_NAME: ci

  deploy-to-sis:
    name: Deploy to SiS (main only)
    # Deploys only after BOTH unit tests and integration tests pass.
    # Unit tests validate logic against the Snowpark emulator;
    # integration tests validate against the real Snowflake engine.
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install snow CLI
        run: uv tool install snowflake-cli

      - name: Configure Snowflake CI connection
        # snow CLI requires token_file_path (inline token not supported).
        # Write the PAT from GitHub Secrets to a temp file, then create
        # a named connection that 30_deploy.sh uses with -c ci.
        # config.toml must be chmod 0600 or snow CLI refuses to read it.
        run: |
          echo "$SF_PAT_TOKEN" > /tmp/sf_token.txt
          mkdir -p ~/.snowflake
          printf '[connections.ci]\naccount = "sfseeurope-wkot_demo1"\nuser = "wkot"\nauthenticator = "PROGRAMMATIC_ACCESS_TOKEN"\ntoken_file_path = "/tmp/sf_token.txt"\n' \
            > ~/.snowflake/config.toml
          chmod 0600 ~/.snowflake/config.toml
        env:
          SF_PAT_TOKEN: ${{ secrets.SF_PAT_TOKEN }}

      - name: Deploy to Snowflake SiS
        # Workspace-native deploy: uploads app/ to Snowflake stage via snow streamlit deploy.
        # Uses app/snowflake.yml for compute pool, runtime, EAI settings.
        # No GIT REPOSITORY FETCH required -- CI checks out the code directly.
        run: scripts/30_deploy.sh -c ci
