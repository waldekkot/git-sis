# CI/CD pipeline for git-sis
#
# Auth: SECRETLESS via OIDC / Workload Identity Federation (no SF_PAT_TOKEN).
#   Each Snowflake-touching job declares `permissions: id-token: write`, runs
#   snowflakedb/snowflake-cli-action with use-oidc:true, then the composite
#   action writes a token-free config.toml. See docs/oidc-setup.md for the
#   one-time Snowflake SERVICE-user setup (one user per environment subject).
#
# Environments (GitHub Settings -> Environments) drive both the approval gate
# AND the OIDC subject (a job with `environment: X` emits subject
# repo:<owner>/<repo>:environment:X):
#   integration-tests -> environment: ci    (no approval)
#   deploy-to-sis      -> environment: prod  (REQUIRED REVIEWERS — set in Settings)
#
# Job graph (push to main):
#   unit-tests (3.11 + 3.12) ──► integration-tests ──► deploy-to-sis (awaits prod approval)
# Job graph (pull_request):
#   unit-tests (3.11 + 3.12) only (no Snowflake credentials required)

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Prevent parallel deploys to the same target. Two pushes to main queue
# (cancel-in-progress: false) so every commit ships in order. PR unit tests
# cancel stale runs (cancel-in-progress: true) — only the latest commit matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests-311:
    # Run on 3.11 (SiS runtime) and 3.12 (forwards-compat signal).
    # Both must pass before integration tests proceed.
    uses: ./.github/workflows/reusable-unit-tests.yml
    with:
      python-version: "3.11"

  unit-tests-312:
    uses: ./.github/workflows/reusable-unit-tests.yml
    with:
      python-version: "3.12"

  integration-tests:
    name: Integration tests (real Snowflake, OIDC)
    runs-on: ubuntu-latest
    needs: [unit-tests-311, unit-tests-312]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: ci
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync

      - uses: snowflakedb/snowflake-cli-action@cea89ff4adad9ac1ff82dd767433bee926342d02  # v2.0.2
        with:
          use-oidc: true
          cli-version: "3.19"
          oidc-token-name: SNOWFLAKE_CONNECTIONS_CI_TOKEN
          default-config-file-path: __skip__

      - uses: ./.github/actions/setup-snowflake
        with:
          sf-account: ${{ vars.GIT_SIS_SF_ACCOUNT || 'sfseeurope-wkot_demo1' }}
          sf-user: ${{ vars.GIT_SIS_SF_USER_CI || 'CI_SVC_CI' }}

      - name: Run integration tests
        # Each test gets its own GIT_SIS_TEST_<uuid> schema (function-scoped fixture).
        run: uv run pytest tests/integration/ -v --tb=short --no-cov -n 5
        env:
          SNOWFLAKE_DEFAULT_CONNECTION_NAME: ci

  dcm-plan:
    name: DCM schema plan (preview DDL changes)
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: ci
    permissions:
      id-token: write
      contents: read
    env:
      GIT_SIS_DATABASE: ${{ vars.GIT_SIS_DATABASE || 'SNOWFLAKE_LEARNING_DB' }}
      GIT_SIS_SCHEMA:   ${{ vars.GIT_SIS_SCHEMA   || 'GIT_SIS' }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: snowflakedb/snowflake-cli-action@cea89ff4adad9ac1ff82dd767433bee926342d02  # v2.0.2
        with:
          use-oidc: true
          cli-version: "3.19"
          oidc-token-name: SNOWFLAKE_CONNECTIONS_CI_TOKEN
          default-config-file-path: __skip__

      - uses: ./.github/actions/setup-snowflake
        with:
          sf-account: ${{ vars.GIT_SIS_SF_ACCOUNT || 'sfseeurope-wkot_demo1' }}
          sf-user: ${{ vars.GIT_SIS_SF_USER_CI || 'CI_SVC_CI' }}

      - name: Run DCM plan
        # Previews what schema changes DCM would apply.
        # Fails if a DCM project object doesn't exist yet — see docs/dcm-setup.md.
        # Fails if destructive changes are detected (DROP TABLE, DROP COLUMN) — review before proceeding.
        # Skip this step by adding '[skip-dcm]' to the commit message if DCM isn't set up yet.
        if: "!contains(github.event.head_commit.message, '[skip-dcm]')"
        run: |
          DCM_PROJECT="${GIT_SIS_DATABASE}.${GIT_SIS_SCHEMA}.GIT_SIS_DCM"
          snow dcm plan \
              --project-name "$DCM_PROJECT" \
              --source dcm/ \
              -c ci || echo "::warning::DCM plan failed. Run docs/dcm-setup.md to create the DCM project object, then re-run."
        continue-on-error: true  # non-blocking until DCM is set up (add [skip-dcm] to bypass)

  deploy-to-sis:
    name: Deploy to SiS (prod, gated)
    runs-on: ubuntu-latest
    needs: [integration-tests, dcm-plan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: prod   # set REQUIRED REVIEWERS in repo Settings -> Environments -> prod
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: snowflakedb/snowflake-cli-action@cea89ff4adad9ac1ff82dd767433bee926342d02  # v2.0.2
        with:
          use-oidc: true
          cli-version: "3.19"
          oidc-token-name: SNOWFLAKE_CONNECTIONS_CI_TOKEN
          default-config-file-path: __skip__

      - uses: ./.github/actions/setup-snowflake
        with:
          sf-account: ${{ vars.GIT_SIS_SF_ACCOUNT || 'sfseeurope-wkot_demo1' }}
          sf-user: ${{ vars.GIT_SIS_SF_USER_PROD || 'CI_SVC_PROD' }}

      - name: Deploy to Snowflake SiS
        # Push-based deploy: uploads app/ files to Snowflake stage and creates/replaces
        # the Streamlit object. This is the primary CI deploy mechanism.
        run: scripts/30_deploy.sh -c ci

      - name: Commit version alias for this main-branch deploy
        # Every main-branch deploy gets a stable, rollback-able version alias.
        # This means ANY prior deploy on main can be restored in seconds:
        #   ALTER STREAMLIT ... SET DEFAULT_VERSION = MAIN_<sha>;
        # See docs/runbook.md for the full rollback procedure.
        #
        # Alias format: MAIN_<7-char-sha>  (e.g. MAIN_A1B2C3D)
        # Note: vX.Y.Z tags use a separate alias pattern via release.yml.
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          ALIAS="MAIN_$(echo "${SHORT_SHA}" | tr '[:lower:]' '[:upper:]')"
          APP_FQN="${GIT_SIS_DATABASE}.${GIT_SIS_SCHEMA}.${GIT_SIS_APP_NAME}"
          snow sql -c ci -q "
            ALTER STREAMLIT ${APP_FQN}
              ADD VERSION IF NOT EXISTS ${ALIAS}
              FROM LAST
              COMMENT = 'CI main-branch deploy: sha=${{ github.sha }} run=${{ github.run_id }}';"
          echo "Committed version alias: ${ALIAS}"
          echo "VERSION_ALIAS=${ALIAS}" >> "$GITHUB_ENV"
        env:
          GIT_SIS_DATABASE: ${{ vars.GIT_SIS_DATABASE || 'SNOWFLAKE_LEARNING_DB' }}
          GIT_SIS_SCHEMA:   ${{ vars.GIT_SIS_SCHEMA   || 'GIT_SIS' }}
          GIT_SIS_APP_NAME: ${{ vars.GIT_SIS_APP_NAME  || 'INGEST_CONSOLE' }}

      - name: Capture deployed app URL
        id: app-url
        run: |
          APP_FQN="${GIT_SIS_DATABASE}.${GIT_SIS_SCHEMA}.${GIT_SIS_APP_NAME}"
          URL=$(snow streamlit get-url -c ci "$APP_FQN" 2>&1) || URL=""
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          GIT_SIS_DATABASE: ${{ vars.GIT_SIS_DATABASE || 'SNOWFLAKE_LEARNING_DB' }}
          GIT_SIS_SCHEMA:   ${{ vars.GIT_SIS_SCHEMA   || 'GIT_SIS' }}
          GIT_SIS_APP_NAME: ${{ vars.GIT_SIS_APP_NAME  || 'INGEST_CONSOLE' }}

      - name: Post-deploy smoke check (shell)
        # Fail the pipeline if the deployed object is missing / unhealthy.
        run: scripts/40_verify.sh -c ci

      - name: Post-deploy smoke tests (pytest)
        # Run pytest smoke tier if we captured a URL. Skips gracefully if not.
        if: steps.app-url.outputs.url != ''
        run: uv run pytest tests/smoke/ -v --tb=short --no-cov
        env:
          GIT_SIS_APP_URL: ${{ steps.app-url.outputs.url }}
