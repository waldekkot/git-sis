name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: Unit tests + lint (no Snowflake)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short

      - name: Run ruff lint
        run: uv run ruff check app/

  deploy-to-sis:
    name: Deploy to SiS (main only)
    runs-on: ubuntu-latest
    needs: unit-tests
    # Only redeploy on direct push to main, not on PRs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install snow CLI
        run: uv tool install snowflake-cli

      - name: Configure Snowflake CI connection
        # snow CLI requires token_file_path (inline token not supported).
        # Write the PAT from GitHub Secrets to a temp file, then create
        # a named connection that 30_deploy.sh uses with -c ci.
        # config.toml must be chmod 0600 or snow CLI refuses to read it.
        run: |
          echo "$SF_PAT_TOKEN" > /tmp/sf_token.txt
          mkdir -p ~/.snowflake
          printf '[connections.ci]\naccount = "sfseeurope-wkot_demo1"\nuser = "wkot"\nauthenticator = "PROGRAMMATIC_ACCESS_TOKEN"\ntoken_file_path = "/tmp/sf_token.txt"\n' \
            > ~/.snowflake/config.toml
          chmod 0600 ~/.snowflake/config.toml
        env:
          SF_PAT_TOKEN: ${{ secrets.SF_PAT_TOKEN }}

      - name: Deploy to Snowflake SiS
        # Workspace-native deploy: uploads app/ to Snowflake stage via snow streamlit deploy.
        # Uses app/snowflake.yml for compute pool, runtime, EAI settings.
        # No GIT REPOSITORY FETCH required -- CI checks out the code directly.
        run: scripts/30_deploy.sh -c ci
