# CI/CD pipeline for git-sis
#
# Auth: currently PAT-based (SF_PAT_TOKEN GitHub Secret → composite action).
#
# OIDC upgrade (secretless — recommended for production):
#   1. Run the SQL in docs/oidc-setup.md on your Snowflake account.
#   2. In each job that contacts Snowflake, replace:
#        uses: ./.github/actions/setup-snowflake
#      with:
#        uses: snowflakedb/snowflake-cli-action@v2
#        with:
#          use-oidc: true
#          cli-version: "3.19"
#      and add  permissions: { id-token: write, contents: read }  to the job.
#   3. Remove SF_PAT_TOKEN from GitHub Secrets.
#
# Job graph (push to main):
#   unit-tests ──► integration-tests ──► deploy-to-sis
#
# Job graph (pull_request):
#   unit-tests only (no Snowflake credentials required)

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: Unit tests + lint (no Snowflake)
    # Runs on every push and every PR — no credentials required.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short

      - name: Run ruff lint
        run: uv run ruff check app/

  integration-tests:
    name: Integration tests (real Snowflake)
    # Runs after unit tests pass, on push to main only.
    # Uses the CI connection; creates and drops a disposable
    # GIT_SIS_TEST_<uuid> schema — never touches production data.
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync

      - uses: ./.github/actions/setup-snowflake
        with:
          sf-pat-token: ${{ secrets.SF_PAT_TOKEN }}

      - name: Run integration tests
        # Each test gets its own GIT_SIS_TEST_<uuid> schema (function-scoped fixture).
        # -n 5: 5 concurrent workers → schemas created/dropped in parallel.
        # --no-cov: integration tests cover only lib/ingest.py; full coverage
        #           is measured by the unit-tests job.
        run: uv run pytest tests/integration/ -v --tb=short --no-cov -n 5
        env:
          SNOWFLAKE_DEFAULT_CONNECTION_NAME: ci

  deploy-to-sis:
    name: Deploy to SiS (main only)
    # Deploys only after BOTH unit tests and integration tests pass.
    # Unit tests validate logic against the Snowpark emulator;
    # integration tests validate against the real Snowflake engine.
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: snowflakedb/snowflake-cli-action@v2
        with:
          cli-version: "3.19"
          default-config-file-path: ""   # config is written by setup-snowflake below

      - uses: ./.github/actions/setup-snowflake
        with:
          sf-pat-token: ${{ secrets.SF_PAT_TOKEN }}

      - name: Deploy to Snowflake SiS
        # Workspace-native deploy: uploads app/ to Snowflake stage via snow streamlit deploy.
        # Uses app/snowflake.yml for compute pool, runtime, EAI settings.
        # No GIT REPOSITORY FETCH required — CI checks out the code directly.
        run: scripts/30_deploy.sh -c ci
