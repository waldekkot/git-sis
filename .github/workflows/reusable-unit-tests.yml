# Reusable unit-test workflow — called by ci.yml and preview.yml.
#
# Runs: unit tests + ruff lint + import-linter architecture check.
# No Snowflake credentials required — purely local, runs on every push/PR.
#
# Usage in callers:
#   jobs:
#     unit-tests:
#       uses: ./.github/workflows/reusable-unit-tests.yml
#       with:
#         python-version: "3.11"   # optional, defaults to 3.11

name: Unit tests (reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to test with"
        type: string
        default: "3.11"

jobs:
  unit-tests:
    name: Unit tests + lint + arch (Python ${{ inputs.python-version }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short

      - name: Run ruff lint
        run: uv run ruff check app/

      - name: Enforce architecture (lib must not import streamlit)
        # import-linter contract in app/.importlinter; run from app/ so `lib`
        # resolves to app/lib, --project .. uses the root dev venv.
        run: cd app && uv run --project .. lint-imports

      - name: Lint tutorial docs for drift
        # Fails if tutorial HTML references stale Python/snow CLI versions
        # or Makefile targets that no longer exist.
        run: scripts/check-docs.sh
