repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty (type check)
        entry: uv run ty check app/lib/
        language: system
        types: [python]
        pass_filenames: false

      - id: import-linter
        name: import-linter (lib must not import streamlit)
        entry: bash -c 'cd app && uv run --project .. lint-imports'
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-unit
        name: pytest unit (no Snowflake)
        entry: uv run pytest tests/unit/ --tb=short -q
        language: system
        types: [python]
        pass_filenames: false
