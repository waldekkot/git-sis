# Snowflake-branded Streamlit theme.
# Works locally and in SiS (container runtime honors the config).
[theme]
base = "light"
primaryColor = "#29B5E8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5FBFE"
textColor = "#11567F"
font = "sans serif"

[server]
# Keep local dev quiet; harmless in SiS.
headless = true
