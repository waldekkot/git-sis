[project]
name = "git-sis"
version = "0.1.0"
description = "Git-connected Streamlit-in-Snowflake ingestion ops console (Streamlit + Snowpark)"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "snowflake-snowpark-python>=1.20",
    "snowflake-connector-python>=3.12",
    "pandas>=2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
# Integration tests require a live Snowflake connection; skip them unless opted-in.
# Run them with: uv run pytest tests/integration/ -v
markers = [
    "integration: marks tests that require a real Snowflake connection (skip in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
