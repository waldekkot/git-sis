[project]
name = "git-sis"
version = "0.1.0"
description = "Git-connected Streamlit-in-Snowflake ingestion ops console (Streamlit + Snowpark)"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.45",
    "snowflake-snowpark-python>=1.21",
    "snowflake-connector-python>=3.13",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "snowflake-snowpark-python[localtest]>=1.21",
    "ruff>=0.15.16",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-watch>=4.2",
    "ty>=0.0.42",
    "pre-commit>=4.0",
    "pytest-xdist>=3.8.0",
    "import-linter>=2.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=80"
# Integration tests require a live Snowflake connection; skip them unless opted-in.
# Run them with: uv run pytest tests/integration/ -v
markers = [
    "integration: marks tests that require a real Snowflake connection (skip in CI)",
    "smoke: marks post-deploy tests that require GIT_SIS_APP_URL (skipped unless set)",
]
filterwarnings = [
    # Benign pandas compat warning from snowflake.snowpark.mock internals
    "ignore::UserWarning:snowflake.snowpark.mock",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
